<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سِراج — دون اتصال</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F1E0">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #EFE5CE; color: #2B2218; font-family: Amiri, "Noto Naskh Arabic", "Segoe UI", Tahoma, serif; font-size: 1.15rem; text-align: center; }
  main { max-width: 420px; }
  img { width: 96px; height: 96px; margin-bottom: 12px; }
  h1 { margin: 0 0 6px; font-size: 1.5rem; color: #1F3A6B; }
  p { line-height: 1.9; margin: 8px 0; color: #65584A; }
  .btns { display: grid; gap: 10px; margin-top: 18px; }
  a, button { display: block; padding: 13px 16px; border-radius: 5px; border: 1px solid #B88A2E; background: transparent; color: #1F3A6B; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  a.primary { background: #1F3A6B; color: #F8F1E0; }
</style>
</head>
<body>
<main>
  <img src="assets/images/icon-192.png" alt="شعار سِراج" width="96" height="96">
  <h1>أنت دون اتصال</h1>
  <p>تعذّر تحميل هذه الصفحة لأنها لم تُحفظ على جهازك بعد، والشبكة غير متاحة الآن.</p>
  <p>ما نزّلتَه أو فتحتَه سابقاً (المكتبة، القرآن المنزَّل، الأدعية، الأدوات) يعمل محلياً. جرّب فتح الصفحة الرئيسية.</p>
  <div class="btns">
    <a class="primary" href="index.html">فتح سِراج</a>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </div>
</main>
</body>
</html>
