<!-- الخطوط من Google Fonts (Cairo للواجهة، Amiri للنصوص، Amiri Quran للمصحف) تُحمَّل دون حجب الرسم؛ حتى تصل تُستخدم خطوط النظام العربية. في APK تُضمَّن الخطوط محلياً وقت البناء. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">

<script>
/* تطبيق المظهر قبل الرسم لتفادي وميض الأبيض في الوضع الليلي */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('siraj.settings.v1') || '{}');
    var th = s.theme || 'auto';
    if (th === 'auto') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = th;
    if (s.elder) document.documentElement.dataset.elder = '1';
  } catch (e) {}
})();
</script>
